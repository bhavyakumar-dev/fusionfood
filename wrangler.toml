# ====================================================================
# Cloudflare Pages Configuration for Fusion Food Family Lab
# ====================================================================

name = "foodfusionweb"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages Static Assets Directory
pages_build_output_dir = "."

# --------------------------------------------------------------------
# Cloudflare D1 Relational Database Binding
# --------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "foodfusionweb"
database_id = "653756d0-4a06-4e6a-b022-13d4635125c3"

# --------------------------------------------------------------------
# Cloudflare Workers KV Namespace Binding (Cache & Offline Fallback)
# --------------------------------------------------------------------
[[kv_namespaces]]
binding = "KV"
id = "kv-fusion-food-family-lab-001"

# --------------------------------------------------------------------
# Environment Variables & Custom Settings
# --------------------------------------------------------------------
[vars]
ENVIRONMENT = "production"
APP_NAME = "Fusion Food Family Lab"
CORS_ORIGIN = "https://foodfusionweb.pages.dev"
