name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check bundle.js

      - name: Verify source and browser bundle match
        run: cmp --silent app.js bundle.js

      - name: Run static-compatible feature tests
        run: node run_e2e_tests.js --no-chrome

      - name: Prepare the static website
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html bundle.js styles.css .nojekyll _site/
          cp -R v1 v2 v3 _site/
          test -s _site/index.html
          test -s _site/bundle.js
          test -s _site/styles.css

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
